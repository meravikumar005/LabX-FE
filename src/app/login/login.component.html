<div class="login-screen">
  <form class="card login-card" (ngSubmit)="submit()">
    <div class="brand-mark">SL</div>
    <div class="brand-name">Sarbottam Hospital · Pathology</div>
    <div class="subtitle">Sign in to continue</div>

    @if (error()) {
      <div class="error">{{ error() }}</div>
    }

    <label class="field-label">
      Username
      <input
        class="field-input"
        type="text"
        name="username"
        autocomplete="username"
        [(ngModel)]="username"
        placeholder="e.g. rprasad"
      />
    </label>

    <label class="field-label">
      Password
      <input
        class="field-input"
        type="password"
        name="password"
        autocomplete="current-password"
        [(ngModel)]="password"
        placeholder="••••••••"
      />
    </label>

    <button type="submit" class="btn btn-primary login-btn" [disabled]="submitting()">
      {{ submitting() ? "Signing in…" : "Sign in" }}
    </button>
  </form>
</div>
